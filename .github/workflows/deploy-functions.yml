name: Deploy MingleMart scheduled functions

on:
  workflow_dispatch:

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINGLE6MART_EB6DA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install and build functions
        working-directory: functions
        run: npm install && npm run build

      - name: Deploy scheduled functions
        run: firebase deploy --only functions --project minglemart-eb6da
